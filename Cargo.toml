[workspace]
members = [
    "crates/cellrune",
    "crates/cellrune-interop",
    "crates/cellrune-mcp",
    "bindings/common",
    "bindings/python",
    "bindings/node",
    "release-tests/integration",
]
default-members = ["crates/cellrune"]
exclude = [
    "fuzz",
    "release-tests/package-consumer",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/emulette/cellrune"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
