[workspace]
members = [
    "crates/cellrune",
    "crates/cellrune-interop",
    "crates/cellrune-mcp",
    "bindings/common",
    "bindings/python",
    "bindings/node",
    "release-tests/integration",
]
default-members = ["crates/cellrune"]
exclude = [
    "fuzz",
    "release-tests/package-consumer",
]
resolver = "3"

[workspace.package]
version = "0.1.14"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emulette/cellrune"
publish = false

[workspace.dependencies]
# These are compatibility floors, not snapshots. The committed lockfile supplies the reproducible
# graph; the nightly floor and newest-compatible runs exercise both ends of these requirements.
calamine = { version = "0.36.0", default-features = false }
# `cap_std::fs::Dir` appears in published signatures, so this public dependency must stay
# within one semver family: a multi-major range would let a dependent's resolver hand
# CellRune a different `Dir` than the dependent's own.
cap-std = ">=4.0.2, <5"
clap = { version = ">=4.0.27, <5", features = ["derive"] }
libm = { version = ">=0.1.3, <0.3", default-features = false }
napi = { version = ">=3.12.1, <4", default-features = false, features = ["napi8"] }
napi-build = ">=2.4.1, <3"
napi-derive = ">=3.6.2, <4"
# PCRE2 10.46 is bundled by pcre2-sys 0.2.10. The 0.2.11 wrapper is the first
# release in this range whose published graph fixes that native engine baseline.
pcre2 = ">=0.2.11, <0.3"
pcre2-sys = "=0.2.10"
pyo3 = { version = "0.29.0", features = ["macros"] }
pyo3-build-config = "0.29.0"
quick-xml = { version = "0.41.0", default-features = false }
rmcp = { version = ">=3.0.1, <4", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }
schemars = "1.0.0"
serde = { version = "1.0.194", features = ["derive"] }
serde_json = "1.0.127"
# 0.10.0 is yanked, so 0.10.1 is the lowest version this range can actually resolve — a floor
# below it would claim a configuration no suite (and no dependent) can ever build.
sha2 = { version = ">=0.10.1, <0.12", default-features = false }
tokio = { version = ">=1.44.2, <2", features = [
    "io-std",
    "macros",
    "rt-multi-thread",
    "sync",
] }
tokio-util = "0.7.9"
tracing = "0.1.35"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "fmt",
    "std",
] }
zip = { version = ">=7.2.0, <9", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
