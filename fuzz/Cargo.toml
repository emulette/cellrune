[package]
name = "cellrune-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
cellrune = { version = "=0.1.15", path = "../crates/cellrune" }
# The fuzz graph is excluded from the workspace and always built --locked, so neither the
# floor nor the newest-compatible suite can exercise a range here. Pin the one version the
# nightly campaign actually runs; this is a tool input, not a compatibility floor.
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "xlsx_reader"
path = "fuzz_targets/xlsx_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formula_calculation"
path = "fuzz_targets/formula_calculation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "interactive_session"
path = "fuzz_targets/interactive_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_writer_rewrite"
path = "fuzz_targets/xlsx_writer_rewrite.rs"
test = false
doc = false
bench = false
