[graph]
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[licenses]
include-dev = true
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "NCSA",
    "Zlib",
]
exceptions = [
    # Build-time archive writer for psm, which stacker uses to grow the stack of deep
    # formula recursion. The root policy allows this license for the same crate.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ar_archive_writer" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
