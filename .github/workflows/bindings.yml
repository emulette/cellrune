name: Language bindings

on:
  pull_request:
    paths:
      - ".github/workflows/bindings.yml"
      - "bindings/**"
      - "binding-contract/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE-MIT"
      - "LICENSE-APACHE"
      - "README.md"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bindings.yml"
      - "bindings/**"
      - "binding-contract/**"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE-MIT"
      - "LICENSE-APACHE"
      - "README.md"
      - "rust-toolchain.toml"
  workflow_call:
    inputs:
      scope:
        description: "Artifact ecosystem: all, python, node, or mcp"
        required: false
        type: string
        default: all
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.92.0"

concurrency:
  group: >-
    bindings-${{ github.workflow }}-${{ inputs.scope || 'all' }}-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  validate-scope:
    name: Validate reusable artifact scope
    if: inputs.scope != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a known ecosystem
        env:
          ARTIFACT_SCOPE: ${{ inputs.scope }}
        run: |
          case "$ARTIFACT_SCOPE" in
            all|python|node|mcp) ;;
            *) printf 'unknown artifact scope: %s\n' "$ARTIFACT_SCOPE" >&2; exit 1 ;;
          esac

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    if: inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'python'
    strategy:
      fail-fast: false
      # The full product is what gets published, so it is built where publication happens: the
      # tag, plus maintenance dispatch for checking runner-image drift ahead of one.
      #
      # Everywhere else this runs a single job on the DECLARED FLOOR. The wheels are not abi3,
      # so 3.10 is compiled separately from 3.14 and is the version a new syntax or a raised
      # pyo3 requirement breaks first. Breakage on the newest runtime is caught by Dependabot
      # and by the tag build; breakage on the floor is caught by nothing else and ships.
      matrix: >-
        ${{
          fromJSON(
            (startsWith(github.ref, 'refs/tags/v') ||
              github.event_name == 'workflow_dispatch' ||
              inputs.scope != '') &&
            '{"os":["ubuntu-24.04","macos-15","windows-2025"],"python":["3.10","3.11","3.12","3.13","3.14"]}' ||
            '{"include":[{"os":"ubuntu-24.04","python":"3.10"}]}'
          )
        }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bindings/python/requirements-dev.txt

      - name: Configure path-remapped release builds
        run: python ../scripts/configure_reproducible_rust.py

      - name: Install build and type tools
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Select the host wheel dependency licenses
        run: >-
          python ../scripts/generate_third_party_licenses.py
          --package cellrune-python
          --target host
          --output THIRD_PARTY_LICENSES.md

      # A wheel built natively on the runner inherits the runner's glibc, which produced a
      # manylinux_2_35 tag and locked out RHEL 9 and Amazon Linux 2023 by 0.01 of a glibc version.
      # Zig links against an explicit older glibc instead, so the baseline is a build input rather
      # than a property of whichever image GitHub currently ships. The npm tier already
      # cross-compiles with the same pinned Zig.
      - name: Install Zig for the glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/install_zig/install.py

      - name: Build interpreter-specific wheel against the glibc baseline
        if: runner.os == 'Linux'
        run: >-
          maturin build
          --release
          --locked
          --out dist
          --interpreter python
          --zig
          --compatibility manylinux_2_28

      - name: Build interpreter-specific wheel
        if: runner.os != 'Linux'
        run: maturin build --release --locked --out dist --interpreter python

      # The platform tag is the entire compatibility promise, so it is asserted rather than
      # assumed; `verify_release_artifacts.py` rejects any Linux tag above the declared baseline.
      - name: Verify wheel contents and private-path boundary
        run: >-
          python ../scripts/verify_release_artifacts.py
          --expected-target host
          dist

      - name: Install only the built wheel
        run: >-
          python -m pip install
          --no-index
          --find-links dist
          --only-binary :all:
          --force-reinstall
          "cellrune==$(python ../scripts/workspace_version.py)"

      - name: Run Python binding contract
        run: python tests/binding_contract.py

      - name: Run Python interactive-session tests
        run: python tests/interactive.py

      - name: Run Python introspection tests
        run: python tests/introspection.py

      - name: Run Python responsiveness tests
        run: python tests/responsiveness.py

      - name: Execute the typed Python usage sample
        run: python tests/typing_check.py

      - name: Check Python types
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.10'
        run: mypy --strict tests/typing_check.py

      - name: Upload verified wheel
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch' ||
          inputs.scope != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  python-source-artifact:
    name: Build Python source publication artifact
    if: >-
      (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'python') &&
      (startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        inputs.scope != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: bindings/python/requirements-dev.txt

      - name: Configure path-remapped release builds
        run: python ../scripts/configure_reproducible_rust.py

      - name: Install locked build tools
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Fetch the locked source-build graph
        run: cargo fetch --locked

      - name: Build the sdist and rebuild its wheel
        run: >-
          maturin build
          --release
          --offline
          --sdist
          --out dist
          --interpreter python

      - name: Verify the cross-platform sdist publication archive
        run: python ../scripts/verify_release_artifacts.py dist/*.tar.gz

      - name: Install and exercise the rebuilt wheel offline
        run: |
          python -m venv consumer
          consumer/bin/python -m pip install \
            --no-index \
            --find-links dist \
            --only-binary :all: \
            "cellrune==$(python ../scripts/workspace_version.py)"
          consumer/bin/python tests/binding_contract.py
          consumer/bin/python tests/introspection.py

      - name: Upload verified Python archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-source-publication-archive
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  node:
    name: Node.js 22 (ubuntu-24.04)
    if: inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'node'
    # Compatibility smoke stays on the declared floor. Tag jobs below build and install every
    # actual native artifact, so repeating 22/24/26 across three hosts adds no release product.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.22.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml

      - name: Configure path-remapped release builds
        run: python ../scripts/configure_reproducible_rust.py

      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile

      - name: Select the host native dependency licenses
        run: >-
          python ../scripts/generate_third_party_licenses.py
          --package cellrune-node
          --target host
          --output "${{ runner.temp }}/cellrune-node-THIRD_PARTY_LICENSES.md"

      - name: Build native addon and generated declarations
        run: pnpm build

      - name: Check reviewed public declarations
        run: pnpm typecheck

      - name: Run CommonJS, ESM, binding contract, and event-loop tests
        run: pnpm test

      - name: Install and exercise the packed npm artifact
        run: pnpm test:package
        env:
          CELLRUNE_THIRD_PARTY_LICENSES: ${{ runner.temp }}/cellrune-node-THIRD_PARTY_LICENSES.md
          CELLRUNE_VERIFY_ARCHIVES: "1"

  node-platform-build:
    name: Build Node platform package (${{ matrix.target }})
    if: >-
      (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'node') &&
      (startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        inputs.scope != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            flags: ""
            macos_deployment_target: "11.0"
            needs_zig: false
            cargo_tool: ""
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            flags: ""
            macos_deployment_target: "10.13"
            needs_zig: false
            cargo_tool: ""
          - target: aarch64-pc-windows-msvc
            runner: ubuntu-24.04
            flags: --cross-compile
            needs_zig: false
            cargo_tool: cargo-xwin@0.23.0
          - target: x86_64-pc-windows-msvc
            runner: ubuntu-24.04
            flags: --cross-compile
            needs_zig: false
            cargo_tool: cargo-xwin@0.23.0
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            flags: --use-napi-cross
            needs_zig: false
            cargo_tool: ""
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            flags: --cross-compile
            needs_zig: true
            cargo_tool: cargo-zigbuild@0.23.0
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            flags: --use-napi-cross
            needs_zig: false
            cargo_tool: ""
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            flags: --cross-compile
            needs_zig: true
            cargo_tool: cargo-zigbuild@0.23.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM tools for Windows cross-compilation
        if: endsWith(matrix.target, '-pc-windows-msvc')
        run: rustup component add llvm-tools-preview

      - name: Configure path-remapped release builds
        run: python ../scripts/configure_reproducible_rust.py

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.22.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml

      - name: Install Zig
        if: matrix.needs_zig
        shell: bash
        run: python3 scripts/install_zig/install.py

      - name: Install cross-compilation cargo tools
        if: matrix.cargo_tool != ''
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: ${{ matrix.cargo_tool }}
          fallback: none

      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target-specific native addon
        run: >-
          pnpm exec napi build
          --platform
          --release
          --strip
          --target ${{ matrix.target }}
          ${{ matrix.flags }}
          --js native.js
          --dts native.d.ts
        env:
          CFLAGS_aarch64_unknown_linux_gnu: -std=gnu99
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          XWIN_CACHE_DIR: ${{ github.workspace }}/.xwin

      - name: Strip non-runtime native symbols
        run: python ../scripts/strip_native_artifacts.py ./*.node

      - name: Verify native release boundary
        run: python ../scripts/verify_release_artifacts.py ./*.node

      - name: Upload native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error
          retention-days: 7

  node-platform-host:
    name: Install Node platform package (${{ matrix.target }})
    if: >-
      (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'node') &&
      (startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        inputs.scope != '')
    needs: node-platform-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: node-${{ matrix.target }}
          path: bindings/node

      - name: Install and exercise the packed platform artifact
        run: node tests/packed-consumer.cjs

  node-platform-linux:
    name: Install Node platform package (${{ matrix.target }})
    if: >-
      (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'node') &&
      (startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        inputs.scope != '')
    needs: node-platform-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: node:22.23.1-alpine3.24@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            image: node:22.23.1-alpine3.24@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: node-${{ matrix.target }}
          path: bindings/node

      - name: Install and exercise the packed platform artifact
        run: >-
          docker run
          --rm
          --volume "${{ github.workspace }}:/build"
          --workdir /build/bindings/node
          ${{ matrix.image }}
          node tests/packed-consumer.cjs

  node-platform-assembly:
    name: Assemble every Node platform package
    if: >-
      (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'node') &&
      (startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        inputs.scope != '')
    needs:
      - node-platform-build
      - node-platform-host
      - node-platform-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.22.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: bindings/node/pnpm-lock.yaml

      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch the locked native dependency graph
        run: cargo fetch --locked

      - name: Download every native addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: node-*
          path: bindings/node/artifacts
          merge-multiple: true

      - name: Assemble platform packages
        run: pnpm exec napi artifacts --output-dir artifacts --npm-dir npm

      - name: Generate target-exact native dependency licenses
        run: |
          python ../scripts/generate_third_party_licenses.py --package cellrune-node --target aarch64-apple-darwin --output npm/darwin-arm64/THIRD_PARTY_LICENSES.md
          python ../scripts/generate_third_party_licenses.py --package cellrune-node --target x86_64-apple-darwin --output npm/darwin-x64/THIRD_PARTY_LICENSES.md
          python ../scripts/generate_third_party_licenses.py --package cellrune-node --target aarch64-unknown-linux-gnu --output npm/linux-arm64-gnu/THIRD_PARTY_LICENSES.md
          python ../scripts/generate_third_party_licenses.py --package cellrune-node --target aarch64-unknown-linux-musl --output npm/linux-arm64-musl/THIRD_PARTY_LICENSES.md
          python ../scripts/generate_third_party_licenses.py --package cellrune-node --target x86_64-unknown-linux-gnu --output npm/linux-x64-gnu/THIRD_PARTY_LICENSES.md
          python ../scripts/generate_third_party_licenses.py --package cellrune-node --target x86_64-unknown-linux-musl --output npm/linux-x64-musl/THIRD_PARTY_LICENSES.md
          python ../scripts/generate_third_party_licenses.py --package cellrune-node --target aarch64-pc-windows-msvc --output npm/win32-arm64-msvc/THIRD_PARTY_LICENSES.md
          python ../scripts/generate_third_party_licenses.py --package cellrune-node --target x86_64-pc-windows-msvc --output npm/win32-x64-msvc/THIRD_PARTY_LICENSES.md

      - name: Verify all assembled packages and exercise the host artifact
        run: pnpm test:package
        env:
          CELLRUNE_REQUIRE_ALL_PLATFORM_BINARIES: "1"
          CELLRUNE_VERIFY_ARCHIVES: "1"

      - name: Pack and verify every npm publication artifact
        run: |
          mkdir release
          npm pack ./ --pack-destination release
          for package in ./npm/*; do
            npm pack "$package" --pack-destination release
          done
          python ../scripts/verify_release_artifacts.py release

      - name: Upload verified npm archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-publication-archives
          path: bindings/node/release/*.tgz
          if-no-files-found: error
          retention-days: 7

  mcp-binary:
    name: Build MCP binary bundle (${{ matrix.target }})
    if: >-
      (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'mcp') &&
      (startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch' ||
        inputs.scope != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Configure path-remapped release builds
        run: python bindings/scripts/configure_reproducible_rust.py

      - name: Select target-exact MCP dependency licenses
        run: >-
          python bindings/scripts/generate_third_party_licenses.py
          --package cellrune-mcp
          --target ${{ matrix.target }}
          --output crates/cellrune-mcp/THIRD_PARTY_LICENSES.md

      - name: Build MCP server
        run: cargo build --locked --release --package cellrune-mcp

      - name: Exercise the built MCP executable
        run: cargo run --locked --release --package cellrune-mcp -- --help

      - name: Package MCP server with license materials
        run: >-
          python bindings/scripts/package_mcp.py
          --binary target/release
          --target ${{ matrix.target }}
          --output release

      - name: Verify MCP publication archive
        run: python bindings/scripts/verify_release_artifacts.py release

      - name: Exercise MCP executable from the publication archive
        run: python bindings/scripts/exercise_mcp_bundle.py release

      - name: Upload verified MCP archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  mcp-binary-attestation:
    name: Attest release MCP archives
    if: >-
      (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'mcp') &&
      startsWith(github.ref, 'refs/tags/v')
    needs: mcp-binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified MCP archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mcp-*
          path: release-mcp
          merge-multiple: true

      - name: Attest MCP publication archives
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-mcp/*
