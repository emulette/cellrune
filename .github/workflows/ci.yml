name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.92.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, tests, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install workflow linter
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          destination="${RUNNER_TEMP}/actionlint-bin"
          curl --fail --location --silent --show-error \
            --proto '=https' \
            --proto-redir '=https' \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          mkdir -p "$destination"
          tar --extract --gzip --file "$archive" --directory "$destination" actionlint
          printf '%s\n' "$destination" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions semantics
        run: actionlint

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy, rustfmt

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-1.92.0-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-1.92.0-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check standalone fuzz formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # Every other Rust gate passes --all-features. Feature unification through
      # cellrune-mcp makes a workspace-wide --no-default-features run a no-op, so
      # the published crate's own default feature set is linted on its own.
      - name: Run Clippy on the published crate's default features
        run: cargo clippy --package cellrune --all-targets --locked -- -D warnings

      - name: Lint public API documentation
        run: >-
          cargo clippy
          --package cellrune
          --lib
          --all-features
          --locked
          --
          -D warnings
          -D clippy::missing_errors_doc
          -D clippy::missing_panics_doc
          -D clippy::doc_markdown

      - name: Run workspace tests without benchmark executables
        run: >-
          cargo test
          --workspace
          --lib
          --bins
          --tests
          --examples
          --all-features
          --locked

      - name: Test the published crate's default features
        run: cargo test --package cellrune --lib --tests --locked

      - name: Run public API doctests
        run: cargo test --package cellrune --doc --all-features --locked

      - name: Build public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --package cellrune --no-deps --all-features --locked

      - name: Compile every standalone fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

      # Every copy is reported, not just the first, and the mismatch is printed.
      # A bare `cmp -s` chain aborts silently and says only which step failed.
      - name: Verify packaged license text
        run: |
          status=0
          check() {
            if cmp -s "$1" "$2"; then
              return 0
            fi
            printf '::error file=%s::does not match %s\n' "$2" "$1"
            diff -u "$1" "$2" || true
            status=1
          }
          check LICENSE crates/cellrune/LICENSE
          check LICENSE bindings/python/LICENSE
          check LICENSE bindings/node/LICENSE
          check THIRD_PARTY_LICENSES.md crates/cellrune/THIRD_PARTY_LICENSES.md
          exit "$status"

      # Both READMEs are also the long_description PyPI renders and the front page crates.io and
      # npm render, none of which resolve a repository-relative path. A relative link is a 404 for
      # every reader who did not arrive through GitHub.
      - name: Require absolute links in published READMEs
        run: |
          grep -Hno ']([^)]*)' README.md bindings/node/README.md \
            | sed 's/](\(.*\))$/\1/' \
            | awk '
                BEGIN { FS = ":"; status = 0 }
                {
                  file = $1
                  line = $2
                  target = substr($0, length(file) + length(line) + 3)
                }
                target !~ /^(https?:\/\/|#)/ {
                  printf "::error file=%s,line=%s::relative link %s does not resolve on PyPI, crates.io, or npm\n", file, line, target
                  status = 1
                }
                END { exit status }
              '

      - name: Test release archive boundary validation
        run: python3 bindings/scripts/test_verify_release_artifacts.py

      # Most of this gate's checks are patterns over generated files. A pattern that matched
      # nothing would agree with every version, so its own drift has to be tested too.
      - name: Test version consistency gate
        run: python3 bindings/scripts/test_check_version_consistency.py

      # A partial version bump does not fail where it was made. It fails inside a release run,
      # after the irreversible publish approvals, because a lockfile or a generated shim still
      # names the previous version. This asserts every declaration against the workspace manifest.
      - name: Verify every published version declaration agrees
        run: python3 bindings/scripts/check_version_consistency.py

  msrv:
    name: Minimum supported Rust version, warnings denied
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The workflow-level RUSTUP_TOOLCHAIN pins the current toolchain for every
    # other job and overrides whatever this one installs, so without this the
    # gate checked 1.92.0 and could never fail on an MSRV violation.
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # This action takes its version from the ref it is used at, and it accepts
      # no toolchain input, so this SHA must stay on the 1.88.0 tag while every
      # other job uses the 1.92.0 one. The assertion below is what actually
      # guards that, because nothing else can tell the two SHAs apart.
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-1.88.0-

      # A gate that silently runs the current compiler looks exactly like a
      # passing MSRV check. Assert the real version before trusting the result.
      - name: Require the declared minimum toolchain
        run: |
          declared="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          case "$actual" in
            "$declared"|"$declared".*) ;;
            *)
              printf '::error::MSRV gate ran rustc %s but Cargo.toml declares %s\n' \
                "$actual" "$declared"
              exit 1
              ;;
          esac
          printf 'MSRV gate is running rustc %s\n' "$actual"

      - name: Check workspace libraries with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --lib --all-features --locked

  platform-tests:
    name: Core and MCP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-1.92.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-1.92.0-

      - name: Run core, integration, and MCP unit tests
        run: >-
          cargo test
          --package cellrune
          --package cellrune-integration-tests
          --package cellrune-mcp
          --all-features
          --locked

      - name: Run MCP stdio protocol gate
        run: cargo test --package cellrune-mcp --test stdio_workflow --locked

  dependency-policy:
    name: Rust dependency and license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check workspace dependency policy
        run: cargo deny --all-features check

      - name: Check standalone fuzz dependency policy
        run: >-
          cargo deny
          --manifest-path fuzz/Cargo.toml
          --config fuzz/deny.toml
          check

  package:
    name: Packaged crate and standalone consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Package the public crate
        run: cargo package --package cellrune --locked

      # The consumer compiles against Cargo's extracted package rather than the
      # workspace source, so it only resolves after cargo package has run.
      - name: Exercise only the packaged crate from a fresh consumer
        run: cargo run --manifest-path release-tests/package-consumer/Cargo.toml --locked
