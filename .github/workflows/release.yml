name: Release gate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ref:
    name: Require a semantic version release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject refs that are not a vMAJOR.MINOR.PATCH tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf 'not a release tag: %s\n' "$RELEASE_REF" >&2; exit 1 ;;
          esac

      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Publishing reads the version from the manifests, not from the tag, so a
      # tag that disagrees with them would ship the wrong version under the right
      # name. Nothing downstream can undo that once a registry accepts it.
      - name: Require the tag to match the workspace version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          tagged="${RELEASE_REF#refs/tags/v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$declared" ]; then
            printf '::error::tag v%s does not match the workspace version %s\n' \
              "$tagged" "$declared"
            exit 1
          fi
          printf 'releasing version %s\n' "$declared"

  core:
    name: Exact core, package, MSRV, platform, and policy gates
    needs: release-ref
    uses: ./.github/workflows/ci.yml

  bindings:
    name: Exact wheel, npm, and MCP publication gates
    needs: release-ref
    uses: ./.github/workflows/bindings.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  large-workbook:
    name: Release 50k read, calculate, write, and reopen gate
    needs: release-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Run large-workbook benchmark contract
        run: |
          cargo bench \
            --package cellrune-integration-tests \
            --bench hardening \
            --locked \
            -- 50000 1 | tee hardening-benchmark.txt
          python release-tests/scripts/verify_benchmark.py hardening-benchmark.txt

  complete:
    name: All release gates passed
    if: always()
    needs:
      - release-ref
      - core
      - bindings
      - large-workbook
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every release gate
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BINDINGS_RESULT: ${{ needs.bindings.result }}
          BENCHMARK_RESULT: ${{ needs.large-workbook.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$BINDINGS_RESULT" = "success"
          test "$BENCHMARK_RESULT" = "success"

  # Every publish job below is gated on `complete`, so nothing reaches a registry
  # until every gate has passed. Each one also names a GitHub environment, which
  # is where a required reviewer belongs: a registry upload cannot be undone, and
  # crates.io and PyPI both refuse to ever reuse a version number.
  #
  # crates.io and npm cannot mint their first release over OIDC, so 0.1.0 uses
  # tokens for those two. Once the crate and the nine npm packages exist, attach
  # their trusted publishers, delete both secrets, and drop the token lines here.
  # cellrune-mcp is not published to any registry, so this release is the only
  # way to obtain the binary the README tells MCP clients to launch. Without it
  # the verified bundles expire with the workflow artifacts. A GitHub release can
  # be edited or deleted, unlike a registry upload, so it needs no reviewer gate.
  github-release:
    name: Publish the GitHub release with MCP bundles
    needs: complete
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download every verified MCP archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mcp-*
          path: mcp-bundles
          merge-multiple: true

      - name: Publish the release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '::error::CHANGELOG.md has no %s section\n' "$version"
            exit 1
          fi
          bundles="$(find mcp-bundles -type f | sort)"
          if [ "$(printf '%s\n' "$bundles" | wc -l)" -ne 3 ]; then
            printf '::error::expected 3 MCP bundles, found:\n%s\n' "$bundles"
            exit 1
          fi
          printf '%s\n' "$bundles"
          # shellcheck disable=SC2086
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            $bundles

  publish-crates-io:
    name: Publish cellrune to crates.io
    needs: complete
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package cellrune --locked

  publish-pypi:
    name: Publish cellrune to PyPI
    needs: complete
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download every verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - name: Download the verified source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-source-publication-archive
          path: dist

      - name: Publish wheels and source archive
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  publish-npm:
    name: Publish the @cellrune packages to npm
    needs: complete
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org

      - name: Download verified npm archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-publication-archives
          path: release

      # The archive filenames flatten the scope, so they cannot be told apart
      # reliably. Read the real package name out of each tarball instead.
      #
      # The order is written to a file, one path per line, rather than passed
      # through an environment variable. A publish order that depended on shell
      # word splitting would be one quoting change away from sending the main
      # package first, and that is not something a dry run would catch.
      - name: Order the archives with the platform packages first
        run: |
          : > platform-archives.txt
          : > main-archive.txt
          for archive in release/*.tgz; do
            name="$(tar -xzOf "$archive" package/package.json |
              node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            if [ "$name" = "@cellrune/node" ]; then
              printf '%s\n' "$archive" >> main-archive.txt
            else
              printf '%s\n' "$archive" >> platform-archives.txt
            fi
          done
          platforms="$(wc -l < platform-archives.txt)"
          mains="$(wc -l < main-archive.txt)"
          if [ "$platforms" -ne 8 ] || [ "$mains" -ne 1 ]; then
            printf '::error::expected 8 platform archives and 1 main archive, found %s and %s\n' \
              "$platforms" "$mains"
            exit 1
          fi
          # The main package resolves the platform packages through
          # optionalDependencies, so installing it before they exist fails.
          # Concatenating in this order is what keeps it last.
          cat platform-archives.txt main-archive.txt > publish-order.txt
          cat publish-order.txt

      # npm refuses to republish a version, so a partial upload cannot be retried
      # and would leave the scope half released. Prove all nine are acceptable
      # before any of them is sent.
      - name: Reject the release unless every archive would publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          while IFS= read -r archive; do
            npm publish "$archive" --access public --dry-run
          done < publish-order.txt

      - name: Publish every package, main package last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          while IFS= read -r archive; do
            printf '::group::%s\n' "$archive"
            npm publish "$archive" --access public --provenance
            printf '::endgroup::\n'
          done < publish-order.txt
