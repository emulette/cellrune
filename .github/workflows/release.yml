name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ref:
    name: Validate the release contract
    runs-on: ubuntu-24.04
    # Carries the dependency-policy and default-feature compilations that pull requests no
    # longer run, so the budget covers a cold build of the published crate.
    timeout-minutes: 45
    steps:
      - name: Reject refs that are not a vMAJOR.MINOR.PATCH tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*) ;;
            *) printf 'not a release tag: %s\n' "$RELEASE_REF" >&2; exit 1 ;;
          esac

      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Publishing reads the version from the manifests, not from the tag, so a
      # tag that disagrees with them would ship the wrong version under the right
      # name. Nothing downstream can undo that once a registry accepts it.
      - name: Require the tag to match the workspace version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          tagged="${RELEASE_REF#refs/tags/v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$declared" ]; then
            printf '::error::tag v%s does not match the workspace version %s\n' \
              "$tagged" "$declared"
            exit 1
          fi
          printf 'releasing version %s\n' "$declared"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Restore Cargo registry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-1.92.0-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-1.92.0-

      - name: Verify every published version declaration agrees
        run: python3 bindings/scripts/check_version_consistency.py

      - name: Verify checked-in native dependency license bundles
        run: python3 bindings/scripts/generate_third_party_licenses.py --check

      - name: Verify packaged license text
        run: |
          status=0
          check() {
            if cmp -s "$1" "$2"; then
              return 0
            fi
            printf '::error file=%s::does not match %s\n' "$2" "$1"
            diff -u "$1" "$2" || true
            status=1
          }
          for directory in \
            crates/cellrune \
            bindings/python \
            bindings/node \
            bindings/node/npm/darwin-arm64 \
            bindings/node/npm/darwin-x64 \
            bindings/node/npm/linux-arm64-gnu \
            bindings/node/npm/linux-arm64-musl \
            bindings/node/npm/linux-x64-gnu \
            bindings/node/npm/linux-x64-musl \
            bindings/node/npm/win32-arm64-msvc \
            bindings/node/npm/win32-x64-msvc
          do
            for name in LICENSE-MIT LICENSE-APACHE; do
              if [ ! -f "$directory/$name" ]; then
                printf '::error file=%s::missing license copy\n' "$directory/$name"
                status=1
                continue
              fi
              check "$name" "$directory/$name"
            done
          done
          check THIRD_PARTY_LICENSES.md crates/cellrune/THIRD_PARTY_LICENSES.md
          exit "$status"

      - name: Require absolute links in published READMEs
        run: |
          grep -Hno ']([^)]*)' README.md bindings/node/README.md \
            | sed 's/](\(.*\))$/\1/' \
            | awk '
                BEGIN { FS = ":"; status = 0 }
                {
                  file = $1
                  line = $2
                  target = substr($0, length(file) + length(line) + 3)
                }
                target !~ /^(https?:\/\/|#)/ {
                  printf "::error file=%s,line=%s::relative link %s does not resolve on PyPI, crates.io, or npm\n", file, line, target
                  status = 1
                }
                END { exit status }
              '

      # Advisories are excluded on purpose. They read a live database, so a CVE disclosed
      # between two runs would change whether an unchanged tag can publish; `maintenance.yml`
      # owns that check. Licenses, bans, and sources resolve from the committed lockfile alone
      # and are reproducible for a given revision. They belong here because a dependency under
      # a disallowed license cannot be pulled back out of a downstream lockfile once a registry
      # accepts the upload, and `deny.toml` is what enforces `wildcards = "deny"` on the
      # requirement ranges we publish.
      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check workspace dependency policy
        run: cargo deny --all-features check licenses bans sources

      - name: Check standalone fuzz dependency policy
        run: >-
          cargo deny
          --manifest-path fuzz/Cargo.toml
          --config fuzz/deny.toml
          check licenses bans sources

      # Feature unification through cellrune-mcp means a workspace-wide --all-features run
      # always enables every optional feature, so no other gate compiles the published crate's
      # own default feature set. crates.io never lets a version number be reused, so a
      # default-feature break has to fail before the upload rather than after it.
      - name: Test the published crate's default features
        run: cargo test --package cellrune --lib --tests --locked

  core:
    name: Core, package, MSRV, and platform validation
    needs: release-ref
    uses: ./.github/workflows/ci.yml

  # Every call grants the same permissions, including the two only the MCP scope uses.
  # `bindings.yml` contains one job that requests `id-token: write` and `attestations: write`,
  # and a called workflow is validated against the caller's grant before any `if:` is
  # evaluated. Granting less here does not skip that job, it refuses to start the whole
  # workflow — which is what splitting the former single `bindings` call into three scoped
  # calls did, since only one of the three carried the permissions the single call had.
  python-artifacts:
    name: Python publication artifacts
    needs: release-ref
    uses: ./.github/workflows/bindings.yml
    with:
      scope: python
    permissions:
      contents: read
      id-token: write
      attestations: write

  node-artifacts:
    name: Node publication artifacts
    needs: release-ref
    uses: ./.github/workflows/bindings.yml
    with:
      scope: node
    permissions:
      contents: read
      id-token: write
      attestations: write

  mcp-artifacts:
    name: MCP publication artifacts
    needs: release-ref
    uses: ./.github/workflows/bindings.yml
    with:
      scope: mcp
    permissions:
      contents: read
      id-token: write
      attestations: write

  # Each publish job waits only for its own product validation. Registry jobs also name a GitHub
  # environment, which is where a required reviewer belongs: an upload cannot be undone, and
  # crates.io and PyPI both refuse to ever reuse a version number.
  #
  # Because they refuse reuse, every publish job is also re-run safe: it first checks whether
  # its registry already holds this version and skips the upload when it does. A rerun of a
  # partially published tag therefore converges on fully published instead of failing red on
  # the registries that succeeded the first time — which is how both prior releases ended.
  #
  # crates.io and npm cannot mint their first release over OIDC, so 0.1.0 uses
  # tokens for those two. Once the crate and the nine npm packages exist, attach
  # their trusted publishers, delete both secrets, and drop the token lines here.
  # cellrune-mcp is not published to any registry, so this release is the only
  # way to obtain the binary the README tells MCP clients to launch. Without it
  # the verified bundles expire with the workflow artifacts. A GitHub release can
  # be edited or deleted, unlike a registry upload, so it needs no reviewer gate.
  github-release:
    name: Publish the GitHub release with MCP bundles
    needs: mcp-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The release is complete only when its three MCP bundles are attached. A
      # create that failed mid-upload leaves the release existing but partial,
      # so existence alone must not short-circuit a rerun.
      - name: Skip when the GitHub release is already complete
        id: github-release-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          state=absent
          if assets="$(gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets | length' 2>/dev/null)"; then
            if [ "$assets" -eq 3 ]; then
              state=complete
            else
              state=partial
            fi
          fi
          printf 'release %s: %s\n' "$RELEASE_TAG" "$state"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Download every verified MCP archive
        if: steps.github-release-state.outputs.state != 'complete'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mcp-*
          path: mcp-bundles
          merge-multiple: true

      - name: Publish the release from the changelog entry
        if: steps.github-release-state.outputs.state != 'complete'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_STATE: ${{ steps.github-release-state.outputs.state }}
        run: |
          bundles="$(find mcp-bundles -type f | sort)"
          if [ "$(printf '%s\n' "$bundles" | wc -l)" -ne 3 ]; then
            printf '::error::expected 3 MCP bundles, found:\n%s\n' "$bundles"
            exit 1
          fi
          printf '%s\n' "$bundles"
          if [ "$RELEASE_STATE" = "partial" ]; then
            # Finish the interrupted create: attach the verified bundles to the
            # existing release, replacing any half-uploaded asset.
            # shellcheck disable=SC2086
            gh release upload "$RELEASE_TAG" --clobber $bundles
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '::error::CHANGELOG.md has no %s section\n' "$version"
            exit 1
          fi
          # shellcheck disable=SC2086
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            $bundles

  publish-crates-io:
    name: Publish cellrune to crates.io
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # A version the index already serves cannot be published again, so a rerun
      # after a partial release must skip it rather than fail on it. A probe
      # failure leaves `published` false: publishing stays the authoritative act
      # and at worst reproduces the old duplicate-version error.
      - name: Skip when crates.io already serves this version
        id: crates-io-state
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          published=false
          if response="$(curl --fail --silent --show-error \
            --header 'User-Agent: cellrune-release (https://github.com/emulette/cellrune)' \
            "https://crates.io/api/v1/crates/cellrune/versions")"; then
            if printf '%s' "$response" | jq --exit-status --arg version "$version" \
              'any(.versions[]; .num == $version)' >/dev/null; then
              printf 'cellrune %s is already on crates.io; skipping\n' "$version"
              published=true
            fi
          fi
          printf 'published=%s\n' "$published" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.crates-io-state.outputs.published != 'true'
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      # Exchanges this job's OIDC identity for a token that expires in 30
      # minutes and is revoked when the job ends, so no registry credential is
      # stored in the repository.
      - name: Mint a short-lived crates.io token
        if: steps.crates-io-state.outputs.published != 'true'
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the crate
        if: steps.crates-io-state.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --package cellrune --locked

  publish-pypi:
    name: Publish cellrune to PyPI
    needs: python-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download every verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - name: Download the verified source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-source-publication-archive
          path: dist

      # skip-existing makes a rerun after a partial release converge: files PyPI
      # already holds are skipped instead of failing the whole upload.
      - name: Publish wheels and source archive
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          skip-existing: true

  publish-npm:
    name: Publish the @cellrune packages to npm
    needs: node-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs the npm CLI to exchange the job's OIDC identity for a registry
      # credential, which npm learned in 11.5.1. Node 22 bundles npm 10, which cannot attempt the
      # exchange at all: it publishes without credentials and the registry masks the rejection as
      # E404. The dry-run gate below cannot catch this, because a dry run never authenticates —
      # the 0.1.1 release failed exactly here, on the first real upload.
      - name: Install an npm that can mint OIDC credentials
        run: npm install -g npm@11.18.0

      - name: Download verified npm archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-publication-archives
          path: release

      # The archive filenames flatten the scope, so they cannot be told apart
      # reliably. Read the real package name out of each tarball instead.
      #
      # The order is written to a file, one path per line, rather than passed
      # through an environment variable. A publish order that depended on shell
      # word splitting would be one quoting change away from sending the main
      # package first, and that is not something a dry run would catch.
      - name: Order the archives with the platform packages first
        run: |
          : > platform-archives.txt
          : > main-archive.txt
          for archive in release/*.tgz; do
            name="$(tar -xzOf "$archive" package/package.json |
              node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            # The ./ prefix is load bearing. npm parses a bare `dir/file.tgz`
            # as the GitHub shorthand owner/repo and tries to clone it, so
            # without it every publish fails on `git ls-remote`.
            if [ "$name" = "@cellrune/node" ]; then
              printf './%s\n' "$archive" >> main-archive.txt
            else
              printf './%s\n' "$archive" >> platform-archives.txt
            fi
          done
          platforms="$(wc -l < platform-archives.txt)"
          mains="$(wc -l < main-archive.txt)"
          if [ "$platforms" -ne 8 ] || [ "$mains" -ne 1 ]; then
            printf '::error::expected 8 platform archives and 1 main archive, found %s and %s\n' \
              "$platforms" "$mains"
            exit 1
          fi
          # The main package resolves the platform packages through
          # optionalDependencies, so installing it before they exist fails.
          # Concatenating in this order is what keeps it last.
          cat platform-archives.txt main-archive.txt > publish-order.txt
          cat publish-order.txt

      # npm refuses to republish a version, so prove all nine are acceptable
      # before any of them is sent.
      - name: Reject the release unless every archive would publish
        run: |
          while IFS= read -r archive; do
            npm publish "$archive" --access public --dry-run
          done < publish-order.txt

      # No NODE_AUTH_TOKEN: every package trusts this repository, workflow, and
      # environment, so npm authenticates from the job's OIDC identity. That also
      # sidesteps the account's 2FA, which no longer sits between CI and a
      # publish the way a granular token did.
      #
      # A package is skipped only when `npm view` prints a version for it, so a
      # rerun after a partial upload finishes the remainder instead of failing on
      # the packages that succeeded. The non-empty check matters: some npm
      # releases exit 0 with empty output for a missing version of an existing
      # package, and treating that as published would drop the package from the
      # release.
      - name: Publish every package, main package last
        run: |
          while IFS= read -r archive; do
            manifest="$(tar -xzOf "$archive" package/package.json)"
            name="$(printf '%s' "$manifest" |
              node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
            version="$(printf '%s' "$manifest" |
              node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
              printf 'skipping %s@%s: already on the registry\n' "$name" "$version"
              continue
            fi
            printf '::group::%s\n' "$archive"
            npm publish "$archive" --access public --provenance
            printf '::endgroup::\n'
          done < publish-order.txt
