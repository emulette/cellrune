name: Maintenance

# Manual only. Every check here reads an input this repository does not control — the advisory
# database, live crates.io resolution at both ends of the published ranges, the hosted runner
# images — so none can be answered by a push tier.
#
# Before tagging a release, dispatch the tiers that apply:
#
#   advisories          always; it is cheap
#   latest_dependencies the release touched dependency requirements or the MSRV
#   dependency_floor    the release touched dependency requirements. Resolves every direct
#                       requirement to its declared floor, which no other job compiles
#   fuzz                the release touched the parser, reader, writer, or session
#   binding_artifacts   the release touched anything cross-compiled. Builds the eight targets,
#                       the macOS deployment targets, and the musl containers, which nothing
#                       else builds until the tag itself
#
# Then check that `[workspace.package] version` in Cargo.toml matches the tag.
#
# If you change one of these jobs, dispatch it in the same commit.
on:
  workflow_dispatch:
    inputs:
      advisories:
        description: "Check the workspace against today's advisory database"
        type: boolean
        default: true
      latest_dependencies:
        description: "Compile the newest compatible dependency graph on the declared MSRV"
        type: boolean
        default: false
      dependency_floor:
        description: "Compile every direct requirement resolved to its declared floor"
        type: boolean
        default: false
      fuzz:
        description: "Run the bounded sanitizer campaigns"
        type: boolean
        default: false
      binding_artifacts:
        description: "Build the full cross-compiled binding and MCP artifact tier"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maintenance
  cancel-in-progress: true

jobs:
  # Every other CI job re-runs an unchanged commit against a pinned toolchain and a
  # locked dependency graph, so repeating them here proves nothing. The advisory
  # database is an input that moves on its own; between runs of this workflow, a new
  # advisory reaches the repository through Dependabot security updates and through the
  # `cargo deny` step that every pull request runs.
  advisories:
    name: Fresh advisory database check
    if: inputs.advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check the workspace against today's advisories
        run: cargo deny --all-features check advisories

      - name: Check the standalone fuzz graph against today's advisories
        run: >-
          cargo deny
          --manifest-path fuzz/Cargo.toml
          --config fuzz/deny.toml
          check advisories

  # The second input that moves without a commit from us. `cellrune` publishes version ranges, so
  # a fresh resolve on a dependent's machine can pick up releases we have never compiled.
  #
  # `resolver = "3"` already makes resolution MSRV-aware, so a dependency that *declares* a
  # `rust-version` above ours is held back automatically and cannot break a 1.88 consumer. That is
  # why this job runs a plain `cargo update` rather than `--ignore-rust-version`: it reproduces the
  # graph a 1.88 consumer would actually be given, not a hypothetical one.
  #
  # The gap it closes is the case MSRV-aware resolution cannot see: a dependency that raises its
  # real minimum without declaring `rust-version` at all. Several crates in this graph declare
  # none, `cap-std` among them, so nothing but compiling the resolved graph can catch it.
  # Scheduled rather than per-push for the same reason as the advisory tier: our commit and our
  # lockfile did not change, upstream did. A failure here means a published promise is false, and
  # the fix is an upper bound on the offending requirement or a raised `rust-version`.
  latest-dependencies:
    name: Newest compatible dependencies on the declared MSRV
    if: inputs.latest_dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Require the declared minimum toolchain
        run: |
          declared="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          case "$actual" in
            "$declared"|"$declared".*) ;;
            *)
              printf '::error::latest-dependency check ran rustc %s but Cargo.toml declares %s\n' \
                "$actual" "$declared"
              exit 1
              ;;
          esac
          printf 'latest-dependency check is running rustc %s\n' "$actual"

      - name: Update to the newest semver-compatible dependency graph
        run: cargo update

      - name: Report the resolved graph for triage
        run: cargo tree --package cellrune --all-features --edges normal

      # Not `cargo check`: a dependency inside an allowed range can compile and still read, hash, or
      # format differently, and a caller who resolved that graph would be the first to notice.
      # No `--locked`: the point of this job is to leave the committed lockfile behind.
      - name: Test the updated graph with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo test
          --workspace
          --lib
          --bins
          --tests
          --examples
          --all-features

  # The bottom of the same ranges. `cellrune` publishes version ranges, so a dependent may resolve
  # any version from the declared floor upward, and the committed `Cargo.lock` means no other job
  # ever compiles the bottom. This job resolves every direct requirement down to its declared floor
  # and tests that graph against the declared MSRV, so a floor that is too low fails here instead
  # of in a dependent's build.
  #
  # Scheduled rather than per-push for the same reason as the two tiers above: `generate-lockfile`
  # resolves the whole graph live from crates.io without `--locked`, so an upstream release of any
  # transitive crate can fail this job while our commit and our lockfile are unchanged. On the
  # pull-request tier that would redden every open pull request over a change nobody here made.
  dependency-floor:
    name: Declared dependency floors on the MSRV
    if: inputs.dependency_floor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `-Z direct-minimal-versions` is resolver-only, so the nightly is a tool here rather than
      # the compiler under test. It is pinned to the same date as the fuzz tier. Plain
      # `-Z minimal-versions` is deliberately not used: it also minimises transitive crates, which
      # fails on third-party under-declaration rather than on anything this workspace controls.
      - name: Install pinned nightly resolver
        run: rustup toolchain install nightly-2026-07-22 --profile minimal

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Keep the committed lockfile for comparison
        run: cp Cargo.lock Cargo.lock.committed

      - name: Resolve every direct requirement to its declared floor
        run: >-
          cargo +nightly-2026-07-22
          -Z direct-minimal-versions
          generate-lockfile

      # Semver unification can legitimately hold a direct dependency above its declared floor when
      # a transitive crate requires more, so "every direct requirement equals its floor" is not an
      # assertion this job can make. What it can do is refuse to be silent: when the floor
      # resolution reproduces the committed graph exactly, this job compiled what the `msrv` job
      # already compiles, and the log has to say so rather than read as a passing floor check.
      - name: Report what the floor resolution changed
        run: |
          if diff -q Cargo.lock.committed Cargo.lock >/dev/null; then
            printf '::notice::floor resolution reproduced the committed lockfile exactly, so no declared floor sits below the locked graph and this run exercised no new resolution\n'
          else
            printf 'floor resolution differs from the committed lockfile:\n'
            diff -u Cargo.lock.committed Cargo.lock || true
          fi
          rm Cargo.lock.committed

      # A floor that compiles can still be unsound or vulnerable. Check the graph just resolved by
      # this existing floor job rather than adding another dependency matrix or scheduled job.
      - name: Check the floor graph against today's advisories
        run: cargo deny --all-features check advisories

      # A job that silently ran the current compiler would look exactly like a passing check.
      - name: Require the declared minimum toolchain
        run: |
          declared="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          actual="$(rustc --version | cut -d' ' -f2)"
          case "$actual" in
            "$declared"|"$declared".*) ;;
            *)
              printf '::error::floor check ran rustc %s but Cargo.toml declares %s\n' \
                "$actual" "$declared"
              exit 1
              ;;
          esac
          printf 'floor check is running rustc %s\n' "$actual"

      # Not `cargo check`, for the same reason as the job above: compiling proves nothing about
      # what a floor dependency returns. No `--locked`: the lockfile was just regenerated.
      - name: Test the floor graph with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo test
          --workspace
          --lib
          --bins
          --tests
          --examples
          --all-features

  # Keep fuzzing aligned with stable trust boundaries rather than adding one target per feature.
  # The loop records every target's result before failing the job, so an early crash does not starve
  # later campaigns.
  fuzz:
    name: Bounded sanitizer campaigns
    if: inputs.fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-07-22 --profile minimal

      - name: Restore fuzz dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: fuzz-registry-${{ runner.os }}-nightly-2026-07-22-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-registry-${{ runner.os }}-nightly-2026-07-22-

      # `install-action` has no cargo-fuzz manifest, so the prebuilt path would be the
      # cargo-binstall fallback this workflow deliberately refuses — and cargo-fuzz publishes no
      # prebuilt binaries for it to fetch anyway. Building from crates.io keeps the exact-version
      # pin and lets cargo verify the source against the registry checksums. The previous step
      # failed on this tier's first ever run: the schedule had never fired since the repository
      # went public.
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Require the checked-in fuzz dependency graph
        run: >-
          cargo +nightly-2026-07-22
          metadata
          --manifest-path fuzz/Cargo.toml
          --locked
          --format-version 1
          --no-deps
          > /dev/null

      - name: Run every bounded campaign
        run: |
          status=0
          for target in \
            xlsx_reader \
            formula_calculation \
            interactive_session \
            xlsx_writer_rewrite
          do
            if ! cargo +nightly-2026-07-22 fuzz run "$target" -- \
              -max_total_time=300 \
              -timeout=15 \
              -rss_limit_mb=2048 \
              -print_final_stats=1
            then
              status=1
            fi
          done
          exit "$status"

      - name: Upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  # What the deleted weekly tier actually existed for. Its stated subject was never "run the
  # binding tests again" — it was hosted runner images, which update roughly weekly and break
  # exactly three things: the eight cross-compiled targets, the macOS deployment targets, and the
  # musl container checks. Nothing else in the repository notices that drift.
  #
  # With the full artifact matrix now built only on the tag, that breakage would otherwise first
  # appear during a release run. This job is how it gets found before one instead.
  binding-artifacts:
    name: Full binding and MCP artifact tier
    if: inputs.binding_artifacts
    uses: ./.github/workflows/bindings.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
