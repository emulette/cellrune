[package]
name = "cellrune-python"
description = "Python bindings for CellRune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true

[dependencies]
cellrune-binding-support = { path = "../common", version = "=0.1.0" }
cellrune-interop = { path = "../../crates/cellrune-interop", version = "=0.1.0" }
pyo3 = { version = "=0.29.0", features = ["macros"] }
serde_json = "=1.0.151"

[build-dependencies]
pyo3-build-config = "=0.29.0"
