[package]
name = "cellrune-node"
description = "Node.js bindings for CellRune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[lints.rust]
# napi-rs expands the exported Node-API registration glue with audited unsafe FFI internally.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
cellrune-binding-support = { path = "../common", version = "=0.1.15" }
cellrune-interop = { path = "../../crates/cellrune-interop", version = "=0.1.15" }
napi.workspace = true
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build.workspace = true
