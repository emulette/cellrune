[package]
name = "cellrune-node"
description = "Node.js bindings for CellRune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[lints.rust]
# napi-rs expands the exported Node-API registration glue with audited unsafe FFI internally.
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
cellrune-binding-support = { path = "../common", version = "=0.1.0" }
cellrune-interop = { path = "../../crates/cellrune-interop", version = "=0.1.0" }
napi = { version = "=3.11.0", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.0"
serde_json = "=1.0.151"

[build-dependencies]
napi-build = "=2.3.2"
