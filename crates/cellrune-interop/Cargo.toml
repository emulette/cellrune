[package]
name = "cellrune-interop"
description = "Typed, versioned interop service for CellRune language bindings and MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
capability-fs = ["cellrune/capability-fs", "dep:cap-std"]

[dependencies]
cap-std = { version = "=4.0.2", optional = true }
cellrune = { path = "../cellrune", version = "=0.1.0" }
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.151"
