[package]
name = "cellrune-interop"
description = "Typed, versioned interop service for CellRune language bindings and MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
capability-fs = ["cellrune/capability-fs", "dep:cap-std"]

[dependencies]
# The intra-workspace `cellrune` requirement stays exact because the two crates release in lockstep.
cap-std = { workspace = true, optional = true }
cellrune = { path = "../cellrune", version = "=0.1.5" }
schemars.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
zip.workspace = true
