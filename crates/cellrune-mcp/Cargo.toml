[package]
name = "cellrune-mcp"
description = "Local stdio MCP server for headless CellRune workbook workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
cap-std = "=4.0.2"
cellrune-interop = { path = "../cellrune-interop", version = "=0.1.1", features = ["capability-fs"] }
clap = { version = "=4.6.4", features = ["derive"] }
rmcp = { version = "=2.2.0", default-features = false, features = [
    "macros",
    "server",
    "transport-io",
] }
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = [
    "io-std",
    "macros",
    "rt-multi-thread",
    "sync",
] }
tokio-util = "=0.7.19"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
    "fmt",
    "std",
] }
