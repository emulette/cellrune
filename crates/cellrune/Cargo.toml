[package]
name = "cellrune"
description = "Bounded XLSX/XLSM reading, deterministic calculation, editing, and writing for Rust"
documentation = "https://docs.rs/cellrune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords = ["xlsx", "excel", "spreadsheet", "formula", "parser"]
categories = ["parser-implementations"]
publish = true

[lints]
workspace = true

# docs.rs builds default features only, which would omit the whole capability
# write path from the published documentation.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
capability-fs = ["dep:cap-std"]

[dependencies]
cap-std = { workspace = true, optional = true }
libm.workspace = true
pcre2.workspace = true
pcre2-sys.workspace = true
quick-xml.workspace = true
sha2.workspace = true
zip.workspace = true
